name: Validate IdSarcasm Repo

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install lightweight dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest matplotlib numpy

      - name: Python syntax checks
        run: |
          python -m py_compile \
            scripts/generate_final_analysis.py \
            scripts/generate_progress5_analysis.py \
            scripts/generate_dashboard_data.py \
            scripts/generate_final_error_analysis.py \
            scripts/run_transformer_optimization.py

      - name: Unit tests
        run: python -m pytest tests/ -q

      - name: Regenerate lightweight derived artifacts
        run: |
          python scripts/generate_final_analysis.py
          python scripts/generate_dashboard_data.py
          python scripts/generate_final_error_analysis.py

      - name: Validate dashboard JSON
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          data = json.loads(Path('dashboard/data/dashboard-data.json').read_text(encoding='utf-8'))
          assert data['gap_cards'][0]['optimized_f1'] == 0.7905
          assert {d['dataset']: d['selected_strategy'] for d in data['explorer']['datasets']} == {'twitter': 'default', 'reddit': 'tuned'}
          assert Path('results/figures/final_confusion_matrices.png').exists()
          print('dashboard and final error-analysis artifacts OK')
          PY

      - name: README local-link check
        run: |
          python - <<'PY'
          import re
          from pathlib import Path
          md = Path('README.md').read_text(encoding='utf-8')
          missing = []
          for target in re.findall(r'\[[^\]]*\]\(([^)]+)\)', md):
              path = target.split('#')[0]
              if path and not path.startswith(('http://', 'https://', '#')) and not Path(path).exists():
                  missing.append(path)
          assert not missing, missing
          print('README local links OK')
          PY
